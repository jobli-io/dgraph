# Generated Inputs
#######################

input AddXInput {
	f1: [YRef]
}

input AddYInput {
	f2: [ZRef]
}

input AddZInput {
	f3: [XRef]
}

input UpdateXInput {
	filter: XFilter!
	set: XPatch
	remove: XPatch
}

input UpdateYInput {
	filter: YFilter!
	set: YPatch
	remove: YPatch
}

input UpdateZInput {
	filter: ZFilter!
