#######################
# Input Schema
#######################

type X {
	f1(filter: YFilter, first: Int, offset: Int): [Y] @dgraph(pred: "f1")
	f3(filter: ZFilter, first: Int, offset: Int): [Z] @dgraph(pred: "~f3")
	f1Aggregate(filter: YFilter): YAggregateResult
	f3Aggregate(filter: ZFilter): ZAggregateResult
}

type Y {
	f1(filter: XFilter, first: Int, offset: Int): [X] @dgraph(pred: "~f1")
	f2(filter: ZFilter, first: Int, offset: Int): [Z] @dgraph(pred: "f2")
	f1Aggregate(filter: XFilter): XAggregateResult
	f2Aggregate(filter: ZFilter): ZAggregateResult
}

type Z {
	f2(filter: YFilter, first: Int, offset: Int): [Y] @dgraph(pred: "~f2")
	f3(filter: XFilter, first: Int, offset: Int): [X] @dgraph(pred: "f3")
	f2Aggregate(filter: YFilter): YAggregateResult
	f3Aggregate(filter: XFilter): XAggregateResult
}

#######################
# Extended Definitions
#######################

"""
The Int64 scalar type represents a signed 64‐bit numeric non‐fractional value.
Int64 can represent values in range [-(2^63),(2^63 - 1)].
"""
scalar Int64

"""
The DateTime scalar type represents date and time as a string in RFC3339 format.
For example: "1985-04-12T23:20:50.52Z" represents 20 mins 50.52 secs after the 23rd hour of Apr 12th 1985 in UTC.
"""
scalar DateTime

input IntRange{
	min: Int!
	max: Int!
}

input FloatRange{
	min: Float!
	max: Float!
}

input Int64Range{
	min: Int64!
	max: Int64!
}

input DateTimeRange{
	min: DateTime!
	max: DateTime!
}

input StringRange{
	min: String!
	max: String!
}

enum DgraphIndex {
	int
	int64
	float
	bool
	hash
	exact
	term
	fulltext
	trigram
	regexp
	year
	month
	day
	hour
	geo
	hnsw
}

input AuthRule {
	and: [AuthRule]
	or: [AuthRule]
	not: AuthRule
	rule: String
}

enum HTTPMethod {
	GET
	POST
	PUT
	PATCH
	DELETE
}

enum Mode {
	BATCH
	SINGLE
}

input CustomHTTP {
	url: String!
	method: HTTPMethod!
	body: String
	graphql: String
	mode: Mode
	forwardHeaders: [String!]
	secretHeaders: [String!]
	introspectionHeaders: [String!]
	skipIntrospection: Boolean
}

input DgraphDefault {
	value: String
	expr: String
	evaluationOrder: Int
	"""
	When set, overrides the engine's computed isRefOnly result for the sub-object
	produced by this @default expression.
	  true  — treat the sub-object as a pure cross-reference regardless of which
	          non-@id fields the expression includes (e.g. a required email field
	          included only to satisfy the schema, not as node content).
	  false — always treat the sub-object as a full node definition.
	  null  — (default) let the engine compute isRefOnly normally.
	"""
	refOnly: Boolean
}

input DgraphTransform {
	expr: String
	evaluationOrder: Int
}

input DgraphValidate {
	rule: String
	expr: String
	reason: String
}

input DgraphPostValidate {
	expr:   String
	reason: String
}

input DgraphCascadeDelete {
	onlyIfOrphan: Boolean
	onlyIfOrphanScope: String
	filter: String
	depth: Int
}

type Point {
	longitude: Float!
	latitude: Float!
}

input PointRef {
	longitude: Float!
	latitude: Float!
}

input NearFilter {
	distance: Float!
	coordinate: PointRef!
}

input PointGeoFilter {
	near: NearFilter
	within: WithinFilter
}

type PointList {
	points: [Point!]!
}

input PointListRef {
	points: [PointRef!]!
}

type Polygon {
	coordinates: [PointList!]!
}

input PolygonRef {
	coordinates: [PointListRef!]!
}

type MultiPolygon {
	polygons: [Polygon!]!
}

input MultiPolygonRef {
	polygons: [PolygonRef!]!
}

input WithinFilter {
	polygon: PolygonRef!
}

input ContainsFilter {
	point: PointRef
	polygon: PolygonRef
}

input IntersectsFilter {
	polygon: PolygonRef
	multiPolygon: MultiPolygonRef
}

input PolygonGeoFilter {
	near: NearFilter
	within: WithinFilter
	contains: ContainsFilter
	intersects: IntersectsFilter
}

input GenerateQueryParams {
	get: Boolean
	query: Boolean
	password: Boolean
	aggregate: Boolean
}

input GenerateMutationParams {
	add: Boolean
	update: Boolean
	delete: Boolean
}

directive @hasInverse(field: String!, immutable: Boolean) on FIELD_DEFINITION
directive @search(by: [String!]) on FIELD_DEFINITION
directive @embedding(provider: String, model: String, parameters: String) on FIELD_DEFINITION
directive @dgraph(type: String, pred: String) on OBJECT | INTERFACE | FIELD_DEFINITION
directive @id(interface: Boolean) on FIELD_DEFINITION
directive @default(value: String, expr: String, evaluationOrder: Int, refOnly: Boolean, add: DgraphDefault, update: DgraphDefault) on FIELD_DEFINITION
directive @transform(expr: String, evaluationOrder: Int, add: DgraphTransform, update: DgraphTransform) on FIELD_DEFINITION
directive @cascadeDelete(onlyIfOrphan: Boolean, onlyIfOrphanScope: String, filter: String, depth: Int, authMode: String) on FIELD_DEFINITION
input AuthVariable { key: String! value: [String!]! }
directive @authVariables(vars: [AuthVariable!]!) on OBJECT | INTERFACE
enum CascadeAuthVariableContext { self parent adaptive }
enum CascadeAuthOperation { query add update delete }
enum DateTimeGranularity { year month day hour }
input InterfaceMergePolicy { interface: String! merge: String! operations: [CascadeAuthOperation!] }
directive @cascadeAuth(operations: [CascadeAuthOperation!], depth: Int, bidirectional: Boolean, variableContext: CascadeAuthVariableContext, interfaceOnly: Boolean) on FIELD_DEFINITION
directive @cascadeAuthPolicy(aggregation: String, skipBidirectional: Boolean, skip: Boolean) on OBJECT | INTERFACE
directive @validate(rule: String, expr: String, reason: String, add: DgraphValidate, update: DgraphValidate) on FIELD_DEFINITION
directive @postValidate(expr: String, reason: String, add: DgraphPostValidate, update: DgraphPostValidate) on OBJECT | INTERFACE
directive @oldValue(fields: [String!], first: Int, sort: String) on FIELD_DEFINITION
directive @withSubscription on OBJECT | INTERFACE | FIELD_DEFINITION
directive @secret(field: String!, pred: String) on OBJECT | INTERFACE
directive @auth(
	mergeInto: String
	# When true on an interface, the interface's auth rules are AND-merged into all
	# implementing concrete types AFTER Stage 3 cascade expansion (see auth.go Stage 4).
	# This ensures the check applies to every access path — both own auth and cascade
	# branches — so for OR-policy types: AND(manageable, OR(base, cascade))
	# = OR(AND(base, manageable), AND(cascade, manageable)).
	mergeAfterCascade: Boolean
	password: AuthRule
	query: AuthRule,
	add: AuthRule,
	update: AuthRule,
	delete: AuthRule,
	interfacePolicy: [InterfaceMergePolicy!]) on OBJECT | INTERFACE
directive @custom(http: CustomHTTP, dql: String) on FIELD_DEFINITION
directive @remote on OBJECT | INTERFACE | UNION | INPUT_OBJECT | ENUM
directive @remoteResponse(name: String) on FIELD_DEFINITION
directive @cascade(fields: [String]) on FIELD
directive @lambda on FIELD_DEFINITION
directive @lambdaOnMutate(add: Boolean, update: Boolean, delete: Boolean) on OBJECT | INTERFACE
directive @cacheControl(maxAge: Int!) on QUERY
directive @generate(
	query: GenerateQueryParams,
	mutation: GenerateMutationParams,
	subscription: Boolean) on OBJECT | INTERFACE | FIELD_DEFINITION

