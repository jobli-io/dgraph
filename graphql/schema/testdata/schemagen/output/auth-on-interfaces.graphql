directive @hasInverse(field: String!, immutable: Boolean) on FIELD_DEFINITION
directive @search(by: [String!], strategy: LookupStrategy = DYNAMIC) on FIELD_DEFINITION
directive @embedding(provider: String, model: String, parameters: String) on FIELD_DEFINITION
directive @dgraph(type: String, pred: String) on OBJECT | INTERFACE | FIELD_DEFINITION
directive @id(interface: Boolean) on FIELD_DEFINITION
directive @default(value: String, expr: String, evaluationOrder: Int, refOnly: Boolean, add: DgraphDefault, update: DgraphDefault) on FIELD_DEFINITION
directive @transform(expr: String, evaluationOrder: Int, add: DgraphTransform, update: DgraphTransform) on FIELD_DEFINITION
directive @cascadeDelete(onlyIfOrphan: Boolean, onlyIfOrphanScope: String, filter: String, depth: Int, authMode: String) on FIELD_DEFINITION
input AuthVariable { key: String! value: [String!]! }
directive @authVariables(vars: [AuthVariable!]!) on OBJECT | INTERFACE
enum CascadeAuthVariableContext { self parent adaptive }
enum CascadeAuthOperation { query add update delete }
enum CascadeAuthStrategy { FORWARD REVERSE AUTO }
enum LookupStrategy { FORWARD REVERSE DYNAMIC }
input FilterMetadata { lookup: LookupStrategy }
enum DateTimeGranularity { year quarter month fortnight week day hour }
type GroupByKeyValue { path: String! value: String }
input InterfaceMergePolicy { interface: String! merge: String! operations: [CascadeAuthOperation!] }
directive @cascadeAuth(operations: [CascadeAuthOperation!], depth: Int, bidirectional: Boolean, variableContext: CascadeAuthVariableContext, interfaceOnly: Boolean, strategy: CascadeAuthStrategy) on FIELD_DEFINITION
directive @cascadeAuthPolicy(aggregation: String, skipBidirectional: Boolean, skip: Boolean) on OBJECT | INTERFACE
directive @bypassAuth on FIELD_DEFINITION

directive @validate(rule: String, expr: String, reason: String, add: DgraphValidate, update: DgraphValidate) on FIELD_DEFINITION
directive @postValidate(expr: String, reason: String, add: DgraphPostValidate, update: DgraphPostValidate) on OBJECT | INTERFACE
directive @oldValue(fields: [String!], first: Int, sort: String) on FIELD_DEFINITION
directive @withSubscription on OBJECT | INTERFACE | FIELD_DEFINITION
directive @secret(field: String!, pred: String) on OBJECT | INTERFACE
directive @auth(
	mergeInto: String
	# When true on an interface, the interface's auth rules are AND-merged into all
	# implementing concrete types AFTER Stage 3 cascade expansion (see auth.go Stage 4).
	# This ensures the check applies to every access path — both own auth and cascade
	# branches — so for OR-policy types: AND(manageable, OR(base, cascade))
	# = OR(AND(base, manageable), AND(cascade, manageable)).
	mergeAfterCascade: Boolean
	password: AuthRule
	query: AuthRule,
	add: AuthRule,
	update: AuthRule,
	delete: AuthRule,
	interfacePolicy: [InterfaceMergePolicy!]) on OBJECT | INTERFACE
directive @custom(http: CustomHTTP, dql: String) on FIELD_DEFINITION
directive @remote on OBJECT | INTERFACE | UNION | INPUT_OBJECT | ENUM
directive @remoteResponse(name: String) on FIELD_DEFINITION
directive @cascade(fields: [String]) on FIELD
directive @lambda on FIELD_DEFINITION
directive @lambdaOnMutate(add: Boolean, update: Boolean, delete: Boolean) on OBJECT | INTERFACE
directive @cacheControl(maxAge: Int!) on QUERY
directive @generate(
	query: GenerateQueryParams,
	mutation: GenerateMutationParams,
	subscription: Boolean) on OBJECT | INTERFACE | FIELD_DEFINITION

