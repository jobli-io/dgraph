"""
Regression types: @transform on Campaign.labels injects an @id field (sId)
that is absent from the original mutation input. Phase-1 (existenceQueries)
runs before @transform, so variableObjMap has no entry for the sId XID.
The fix prevents the nested CampaignLabel from being written as a blank node
with no predicates (all field values must survive the rewrite).
"""
type Campaign {
    title: String!
    labels: [CampaignLabel]
        @transform(expr: "map(input.labels ?? [], mapInsert(#, {\"sId\": \"label::\" + #.name}))")
}

type CampaignLabel {
    sId: String @id
    name: String!
}

"""
Regression types for the isRefOnly forward-ref guard (resolvedObj != nil && !isRefOnly).

Widget has two fields that both reference Tag by its XID (key):
  alt   — comes first alphabetically; the user provides a ref-only {key:"..."} input
  primary — provides the full Tag definition {key:"...", value:"..."}

When Phase-1 (existenceQueries) processes the mutation it caches {key,value} for
the Tag XID variable in variableObjMap.  Later, the field loop processes `alt`
first (alphabetical order) and sees resolvedObj != nil in variableObjMap.

Before the fix: the code did `obj = resolvedObj` unconditionally, meaning the
ref-only `alt` input was treated as a full node definition and the Tag was CREATED
inside Widget.alt rather than Widget.primary. With inverse links this produces the
wrong parent context.

After the fix: when isRefOnly is true the code always takes the forward-ref path
regardless of what variableObjMap holds, so Tag is correctly created inside
Widget.primary and Widget.alt just carries a blank-node reference.
"""
type Widget {
    widgetId: String! @id
    alt: Tag
    primary: Tag!
}

type Tag {
    key: String! @id
    value: String!
}

"""
PersonNode / GroupNode — Case 3 regression types.

PersonNode has TWO @id fields:
  xId  — user-provided (present in mutation input from the user)
  sId  — @default-computed from xId at creation time

This mirrors the production User.xId / User.sId pattern.

GroupNode has two edges to PersonNode:
  member — provides the full definition {xId, display} (user input)
  lead   — provides ONLY {sId: "sn_alice"} (as produced by a @default on the
            parent type, which runs at Phase-2 time and generates a sId-only ref)

Alphabetical field ordering: lead < member, so lead is processed first.

Case 3 scenario:
  Phase-1 existence queries:
    PersonNode_1  (lead's sId = "sn_alice") → NO MATCH in qnametouid
    PersonNode_2  (member's xId = "alice")  → HIT  in qnametouid (0xABC)

  Phase-2 field loop:
    lead  {sId:"sn_alice"} → PersonNode_1 → typUidExist=false → forward-ref _:PersonNode_1
    member {xId:"alice", display:"Alice"} → PersonNode_2 → typUidExist=true → asIDReference
      Case 3 loop: sId absent from obj → GetDefaultValue → "sn_alice"
                   varGen.Next(PersonNode, "sId", "sn_alice") = PersonNode_1 (idempotent)
                   forwardRefs["PersonNode_1"] = "_:PersonNode_1" → resolveExactFwdRef
      blankNodeResolutions["_:PersonNode_1"] = "0xABC"

  patchBlankNodes: GroupNode.lead.uid "_:PersonNode_1" → "0xABC" ✓
"""
type PersonNode {
    xId: String! @id
    sId: String! @id @default(add: {expr: "\"sn_\" + input.xId"})
    display: String!
}

type GroupNode {
    gId: String! @id
    member: PersonNode
    lead: PersonNode
}

"""
AccountNode / AccountHolderNode — shouldReRun default-contamination regression types.

AccountNode has THREE fields of interest:
  email  — user-provided @id (XID)
  handle — @default-computed @id derived from email; triggers shouldReRun when the
            computed handle value already exists in Dgraph (idExistence hit)
  active — non-XID @default(add: {value: "true"})

Without the fix, the @default loop populates obj["active"]=true BEFORE shouldReRun
fires.  The re-run then receives obj={email, handle, active}, making isRefOnly=false,
which causes EnsureNonNulls to fire on an incomplete forward-reference object and
return an incorrect error.

With the fix, the re-run receives only {email, handle} (user-provided + XID defaults)
so isRefOnly=true → typUidExist=true → asIDReference.  No spurious error.

AccountHolderNode has two edges to AccountNode:
  creator  — first alphabetically; provides {email:"a@b.com"} ref-only
  primary  — provides {email:"a@b.com", handle:"@a"} (full xid spec)

shouldReRun scenario:
  Phase-1: AccountNode_1 (creator's email) hits idExistence with "0xDEF"
  Phase-2 creator edge: email → AccountNode_1 → typUidExist=true → Case A
    @default loop computes handle="@a@b.com" → shouldReRun=true
    Bug: rewriteObject(obj={email,active=true}) → isRefOnly=false → error
    Fix: rewriteObject(rerunObj={email,handle="@a@b.com"}) → isRefOnly=false… wait,
         handle is also an @id so isRefOnly checks only @id fields → both email+handle
         are @id → isRefOnly=true → typUidExist=true → asIDReference ✓
"""
type AccountNode {
    email:  String! @id
    handle: String! @id @default(add: {expr: "\"@\" + input.email"})
    active: Boolean! @default(add: {value: "true"})
}

type AccountHolderNode {
    holderId: String! @id
    creator:  AccountNode
    primary:  AccountNode
}